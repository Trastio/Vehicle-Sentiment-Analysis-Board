<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoPulse - 汽车舆情智能助手</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/chat.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚗</text></svg>">
</head>
<body>
    <div class="chat-app">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo">
                    <i class="fas fa-car"></i>
                    <span>AutoPulse</span>
                </div>
                <button class="sidebar-close" onclick="ChatApp.toggleSidebar()" title="收起侧边栏">
                    <i class="fas fa-chevron-left"></i>
                </button>
            </div>
            <button class="new-chat-btn" onclick="ChatApp.newConversation()">
                <i class="fas fa-plus"></i>
                <span>新建对话</span>
            </button>
            <div class="sidebar-section-title">对话历史</div>
            <div class="conversation-list" id="conversationList">
            </div>
            <div class="sidebar-footer">
                <div class="sidebar-footer-info">
                    <i class="fas fa-shield-alt"></i>
                    <span>数据安全加密</span>
                </div>
            </div>
        </aside>

        <div class="sidebar-overlay" id="sidebarOverlay" onclick="ChatApp.toggleSidebar()"></div>

        <div class="main-area">
            <header class="chat-header">
                <div class="header-left">
                    <button class="menu-btn" onclick="ChatApp.toggleSidebar()" title="打开侧边栏">
                        <i class="fas fa-bars"></i>
                    </button>
                    <div class="logo-icon">
                        <i class="fas fa-car"></i>
                    </div>
                    <div class="header-text">
                        <h1>AutoPulse</h1>
                        <div class="header-subtitle">汽车舆情智能助手</div>
                    </div>
                </div>
                <div class="header-right">
                    <button class="header-btn" onclick="ChatApp.newConversation()" title="新对话">
                        <i class="fas fa-plus"></i>
                        <span>新对话</span>
                    </button>
                    <div class="status-indicator">
                        <div class="status-dot"></div>
                        <span class="status-text">在线</span>
                    </div>
                </div>
            </header>

            <main class="chat-main" id="chatMain">
                <div class="chat-messages" id="chatMessages">
                    <div class="welcome-message" id="welcomeMessage">
                        <div class="welcome-bg"></div>
                        <div class="welcome-content">
                            <div class="welcome-icon-wrapper">
                                <div class="welcome-icon">
                                    <i class="fas fa-robot"></i>
                                </div>
                                <div class="welcome-icon-ring"></div>
                            </div>
                            <h2>您好！我是 AutoPulse</h2>
                            <p class="welcome-desc">汽车舆情智能监控助手，为您提供全方位的舆情分析与报告服务</p>
                            <div class="welcome-features">
                                <div class="feature-item">
                                    <i class="fas fa-search"></i>
                                    <span>舆情查询</span>
                                </div>
                                <div class="feature-item">
                                    <i class="fas fa-chart-bar"></i>
                                    <span>可视化报告</span>
                                </div>
                                <div class="feature-item">
                                    <i class="fas fa-file-alt"></i>
                                    <span>舆情报告</span>
                                </div>
                            </div>
                            <div class="quick-tags">
                                <div class="quick-tag-label">快速体验：</div>
                                <span class="quick-tag" onclick="ChatApp.sendQuickTag('帮我分析比亚迪秦PLUS的舆情')">
                                    <i class="fas fa-bolt"></i> 比亚迪秦PLUS
                                </span>
                                <span class="quick-tag" onclick="ChatApp.sendQuickTag('帮我分析特斯拉Model 3的舆情')">
                                    <i class="fas fa-bolt"></i> 特斯拉Model 3
                                </span>
                                <span class="quick-tag" onclick="ChatApp.sendQuickTag('帮我分析比亚迪汉的舆情')">
                                    <i class="fas fa-bolt"></i> 比亚迪汉
                                </span>
                                <span class="quick-tag" onclick="ChatApp.sendQuickTag('帮我分析蔚来ES6的舆情')">
                                    <i class="fas fa-bolt"></i> 蔚来ES6
                                </span>
                                <span class="quick-tag" onclick="ChatApp.sendQuickTag('帮我分析小鹏P7的舆情')">
                                    <i class="fas fa-bolt"></i> 小鹏P7
                                </span>
                                <span class="quick-tag" onclick="ChatApp.sendQuickTag('帮我分析理想L7的舆情')">
                                    <i class="fas fa-bolt"></i> 理想L7
                                </span>
                                <span class="quick-tag" onclick="ChatApp.sendQuickTag('帮我分析问界M7的舆情')">
                                    <i class="fas fa-bolt"></i> 问界M7
                                </span>
                            </div>
                        </div>
                    </div>
                </div>
            </main>

            <footer class="chat-input-area">
                <div class="input-wrapper">
                    <div class="input-container">
                        <textarea id="chatInput" class="chat-input" placeholder="输入消息，如：帮我看看比亚迪秦PLUS的舆情" rows="1" autocomplete="off"></textarea>
                        <button id="sendBtn" class="send-btn" onclick="ChatApp.sendMessage()">
                            <i class="fas fa-paper-plane"></i>
                        </button>
                    </div>
                    <div class="input-hint">按 Enter 发送，Shift+Enter 换行</div>
                </div>
            </footer>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script src="{{ url_for('static', filename='js/chat.js') }}"></script>
</body>
</html>
